name: 抓取公告数据

on:
  schedule:
    - cron: '0 * * 1-2 *'       # 1-2月 每小时
    - cron: '0 * * 10-12 *'     # 10-12月 每小时
    - cron: '0 */6 * 3-9 *'     # 3-9月 每6小时
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          WECOM_BOT_WEBHOOK: ${{ secrets.WECOM_BOT_WEBHOOK }}
          SERVER_CHAN_KEY: ${{ secrets.SERVER_CHAN_KEY }}
        run: python -m src.main

      - name: Commit data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ web/data.json
          git diff --staged --quiet || git commit -m "📋 $(TZ='Asia/Shanghai' date +%Y-%m-%d\ %H:%M) 数据更新"
          git push
