name: 抓取公务员考试公告

on:
  schedule:
    # 公告高频季 (1-2月 多省联考): 每 60 分钟
    - cron: '0 * * 1-2 *'
    # 公告高频季 (10-12月 国考+独立命题): 每 60 分钟
    - cron: '0 * * 10-12 *'
    # 淡季 (3-9月): 每 6 小时
    - cron: '0 */6 * 3-9 *'
  workflow_dispatch:  # 手动触发

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # 需要写权限来 commit + push
      pages: write     # GitHub Pages 部署
      id-token: write  # Pages OIDC

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          WECOM_BOT_WEBHOOK: ${{ secrets.WECOM_BOT_WEBHOOK }}
          SERVER_CHAN_KEY: ${{ secrets.SERVER_CHAN_KEY }}
        run: python -m src.main

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ web/
          git diff --staged --quiet || git commit -m "📋 $(TZ='Asia/Shanghai' date +%Y-%m-%d\ %H:%M) 公告更新"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
