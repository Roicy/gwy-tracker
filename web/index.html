<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公务员考试公告跟踪</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="top-nav">
  <span class="nav-brand">📋 公考公告跟踪</span>
  <div class="nav-links">
    <a href="index.html" class="nav-active">公告列表</a>
    <a href="analysis.html">数据分析</a>
    <a href="guide.html">备考指南</a>
  </div>
</nav>

<header>
  <h1>公务员考试公告跟踪</h1>
  <p class="subtitle">国考 · 省考 · 选调 — 自动化监控</p>

  <div class="activate-bar" id="activate-bar">
    <span id="activate-status">🔒 免费版</span>
    <span id="activate-input-area">
      <input type="text" id="activate-code" placeholder="输入兑换码" maxlength="20">
      <button id="activate-btn" onclick="activateCode()">激活</button>
    </span>
    <span id="activate-done" style="display:none">✅ 已激活</span>
  </div>

  <div class="toolbar">
    <select id="filter-province"><option value="">全部省份</option></select>
    <select id="filter-type"><option value="">全部类型</option></select>
    <input type="text" id="filter-search" placeholder="搜索标题…">
    <button id="filter-star" class="btn-star" onclick="toggleStarFilter()">⭐ 收藏</button>
    <label class="toggle-label"><input type="checkbox" id="toggle-completed"> 隐藏已截止</label>
    <button id="export-btn" class="btn-export" onclick="exportCSV()">📥 导出</button>
    <button id="notify-btn" class="btn-notify" onclick="toggleNotify()" title="开启截止提醒">🔔 提醒</button>
    <span class="update-time" id="update-time"></span>
  </div>
</header>

<main>
  <div class="stats-bar" id="stats-bar"></div>
  <div id="notify-banner" style="display:none"></div>
  <table id="notice-table">
    <thead>
      <tr>
        <th class="expand-col"></th>
        <th class="star-col">⭐</th>
        <th>省份</th>
        <th>类型</th>
        <th>标题</th>
        <th>报名时间</th>
        <th class="countdown-col">⏳ 截止</th>
        <th>笔试时间</th>
        <th class="countdown-col">距笔试</th>
        <th>人数</th>
        <th>状态</th>
      </tr>
    </thead>
    <tbody id="notice-body"><tr><td colspan="11" class="loading">加载数据中…</td></tr></tbody>
  </table>
</main>

<footer>
  <p>数据自动更新 · 来源：各省人事考试网、国家公务员局、粉笔网</p>
</footer>

<script>
// ═══════════════════════════════════════════
// 兑换码系统
// ═══════════════════════════════════════════
let isPremium = false;
let codes = [];
fetch('codes.json').then(r=>r.json()).then(d=>{codes=d.codes||[]}).catch(()=>{});
(function(){if(localStorage.getItem('gwy_premium_hash'))isPremium=true;updatePremiumUI()})();

async function activateCode(){
  const input=document.getElementById('activate-code').value.trim();
  if(!input)return alert('请输入兑换码');
  const hash=await sha256(input);
  if(codes.find(c=>c.hash===hash)){localStorage.setItem('gwy_premium_hash',hash);isPremium=true;updatePremiumUI();alert('🎉 激活成功！');}
  else alert('❌ 无效的兑换码');
}
function updatePremiumUI(){
  document.getElementById('activate-status').textContent=isPremium?'✅ 付费版':'🔒 免费版';
  document.getElementById('activate-input-area').style.display=isPremium?'none':'';
  document.getElementById('activate-done').style.display=isPremium?'':'none';
  document.getElementById('export-btn').className=isPremium?'btn-export':'btn-export locked';
}
async function sha256(m){const b=new TextEncoder().encode(m);const h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('')}

// ═══════════════════════════════════════════
// 收藏系统
// ═══════════════════════════════════════════
let bookmarks = new Set(JSON.parse(localStorage.getItem('gwy_bookmarks')||'[]'));
let starFilterOn = false;

function saveBookmarks(){localStorage.setItem('gwy_bookmarks',JSON.stringify([...bookmarks]))}
function toggleBookmark(id,ev){ev.stopPropagation();bookmarks.has(id)?bookmarks.delete(id):bookmarks.add(id);saveBookmarks();renderTable()}
function toggleStarFilter(){starFilterOn=!starFilterOn;document.getElementById('filter-star').className=starFilterOn?'btn-star active':'btn-star';renderTable()}

// ═══════════════════════════════════════════
// 浏览器通知
// ═══════════════════════════════════════════
let notifyEnabled = localStorage.getItem('gwy_notify')==='1';
updateNotifyBtn();

function toggleNotify(){
  if(!notifyEnabled){
    if(!('Notification' in window))return alert('你的浏览器不支持通知');
    Notification.requestPermission().then(p=>{
      if(p==='granted'){notifyEnabled=true;localStorage.setItem('gwy_notify','1');updateNotifyBtn();checkDeadlines()}
      else alert('需要允许通知权限才能使用提醒功能');
    });
  }else{notifyEnabled=false;localStorage.setItem('gwy_notify','0');updateNotifyBtn()}
}
function updateNotifyBtn(){
  const b=document.getElementById('notify-btn');
  b.className=notifyEnabled?'btn-notify active':'btn-notify';
  b.title=notifyEnabled?'提醒已开启':'点击开启截止提醒';
}
function checkDeadlines(){
  if(!notifyEnabled||!isPremium)return;
  const now=new Date();
  allNotices.forEach(n=>{
    if(!n.apply_end||bookmarks.has(n.id))return; // 收藏的才提醒
    if(!bookmarks.has(n.id))return;
    const d=parseDate(n.apply_end);if(!d)return;
    const diff=Math.ceil((d-now)/86400000);
    if(diff>=0&&diff<=3){
      new Notification(`⏰ 报名即将截止`,{body:`${n.province}·${n.exam_type}: ${n.title.slice(0,40)}...\n截止: ${n.apply_end}`,icon:'📋'});
    }
  });
}

// ═══════════════════════════════════════════
// 数据加载
// ═══════════════════════════════════════════
let allNotices=[],allStats={},now=new Date(),expandedRows=new Set();
fetch('data.json').then(r=>r.json()).then(data=>{
  now=new Date();allNotices=data.notices||[];allStats=data.stats||{};
  document.getElementById('update-time').textContent='更新: '+(data.updated_at||'-');
  initFilters();renderStats();renderTable();
  setTimeout(checkDeadlines,2000);
}).catch(e=>{document.getElementById('notice-body').innerHTML='<tr><td colspan="11" class="error">❌ 数据加载失败</td></tr>'});

function initFilters(){
  [...new Set(allNotices.map(n=>n.province))].sort().forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;document.getElementById('filter-province').appendChild(o)});
  [...new Set(allNotices.map(n=>n.exam_type))].sort().forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;document.getElementById('filter-type').appendChild(o)});
  document.getElementById('filter-province').addEventListener('change',renderTable);
  document.getElementById('filter-type').addEventListener('change',renderTable);
  document.getElementById('filter-search').addEventListener('input',renderTable);
  document.getElementById('toggle-completed').addEventListener('change',renderTable);
}

function renderStats(){
  const bar=document.getElementById('stats-bar');
  if(!allStats.total){bar.innerHTML='<span>暂无公告数据</span>';return}
  let aR=0,uE=0,wP=0,bM=bookmarks.size;
  allNotices.forEach(n=>{if(n.apply_end&&new Date(n.apply_end)>=now)aR++;if(n.written_exam&&new Date(n.written_exam)>now)uE++;if(n.position_count>0)wP++});
  bar.innerHTML=[
    `<span class="stat-main">📊 <strong>${allStats.total}</strong> 条公告</span>`,
    `<span class="stat-tag green">🟢 报名中: ${aR}</span>`,
    `<span class="stat-tag blue">📝 待笔试: ${uE}</span>`,
    `<span class="stat-tag orange">📋 含岗位: ${wP}</span>`,
    bM>0?`<span class="stat-tag yellow">⭐ 收藏: ${bM}</span>`:'',
  ].join('');
}

// ═══════════════════════════════════════════
// 工具函数
// ═══════════════════════════════════════════
function parseDate(s){if(!s)return null;const d=new Date(s+'T00:00:00+08:00');return isNaN(d.getTime())?null:d}
function countdown(ds){if(!ds)return{text:'-',cls:''};const t=parseDate(ds);if(!t)return{text:'-',cls:''};const diff=Math.ceil((t-now)/86400000);if(diff<0)return{text:`已过${Math.abs(diff)}天`,cls:'expired'};if(diff===0)return{text:'⚠️今天',cls:'urgent'};if(diff<=3)return{text:`⏰${diff}天`,cls:'urgent'};if(diff<=7)return{text:`📌${diff}天`,cls:'soon'};if(diff<=30)return{text:`${diff}天`,cls:'normal'};return{text:`${diff}天`,cls:'far'}}
function getStatus(n){const ae=parseDate(n.apply_end),as=parseDate(n.apply_start),ex=parseDate(n.written_exam);if(as&&ae&&now>=as&&now<=ae){const dl=Math.ceil((ae-now)/86400000);return dl<=3?{text:'🔥即将截止',cls:'status-urgent'}:{text:'🟢报名中',cls:'status-open'}}if(as&&now<as)return{text:`⏳${Math.ceil((as-now)/86400000)}天后`,cls:'status-upcoming'};if(ae&&now>ae&&ex&&now<ex)return{text:'📝待笔试',cls:'status-exam'};if(ae&&now>ae)return{text:'✅已截止',cls:'status-done'};if(ex&&now>ex)return{text:'🏁已结束',cls:'status-done'};return{text:'📋待定',cls:'status-tbd'}}
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ═══════════════════════════════════════════
// 表格渲染
// ═══════════════════════════════════════════
function renderTable(){
  const prov=document.getElementById('filter-province').value;
  const type=document.getElementById('filter-type').value;
  const search=document.getElementById('filter-search').value.toLowerCase();
  const hideDone=document.getElementById('toggle-completed').checked;

  let filtered=[...allNotices];
  if(prov)filtered=filtered.filter(n=>n.province===prov);
  if(type)filtered=filtered.filter(n=>n.exam_type===type);
  if(search)filtered=filtered.filter(n=>n.title.toLowerCase().includes(search));
  if(hideDone)filtered=filtered.filter(n=>{const st=getStatus(n);return!['✅已截止','🏁已结束'].some(s=>st.text.includes(s))});
  if(starFilterOn)filtered=filtered.filter(n=>bookmarks.has(n.id));

  // 排序：收藏的优先，然后按截止日期
  filtered.sort((a,b)=>{
    if(bookmarks.has(a.id)&&!bookmarks.has(b.id))return -1;
    if(!bookmarks.has(a.id)&&bookmarks.has(b.id))return 1;
    const da=parseDate(a.apply_end),db=parseDate(b.apply_end);
    if(da&&db)return da-db;if(da)return-1;if(db)return 1;
    const ea=parseDate(a.written_exam),eb=parseDate(b.written_exam);
    if(ea&&eb)return ea-eb;if(ea)return-1;if(eb)return 1;
    return 0;
  });

  const tbody=document.getElementById('notice-body');
  if(!filtered.length){tbody.innerHTML='<tr><td colspan="11" class="empty">暂无匹配公告</td></tr>';return}

  tbody.innerHTML=filtered.map(n=>{
    const cdEnd=countdown(n.apply_end),cdExam=countdown(n.written_exam);
    const st=getStatus(n),hasPos=(n.position_count||0)>0;
    const starred=bookmarks.has(n.id);
    const expanded=expandedRows.has(n.id);

    return `
    <tr class="notice-row">
      <td class="expand-cell">${hasPos?`<span class="expand-icon" id="icon-${n.id}" onclick="event.stopPropagation();toggleRow(${n.id})">${expanded?'▼':'▶'}</span>`:''}</td>
      <td class="star-cell"><span class="star-icon ${starred?'starred':''}" onclick="toggleBookmark(${n.id},event)">${starred?'★':'☆'}</span></td>
      <td class="province">${esc(n.province)}</td>
      <td><span class="badge badge-${n.exam_type}">${esc(n.exam_type)}</span></td>
      <td class="title">
        <a href="${esc(n.source_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(n.title)}</a>
        ${hasPos?`<span class="pos-badge">📋${n.position_count}岗</span>`:''}
      </td>
      <td class="date-cell">${n.apply_start?esc(n.apply_start)+' ~<br>'+esc(n.apply_end||''):'-'}</td>
      <td class="countdown-cell ${cdEnd.cls}">${cdEnd.text}</td>
      <td class="date-cell">${esc(n.written_exam||'-')}</td>
      <td class="countdown-cell ${cdExam.cls}">${cdExam.text}</td>
      <td class="count-cell">${n.recruit_count?'<strong>'+esc(String(n.recruit_count))+'</strong> 人':'-'}</td>
      <td><span class="status-tag ${st.cls}">${st.text}</span></td>
    </tr>
    <tr class="position-row" id="pos-${n.id}" style="display:${expanded?'':'none'}">
      <td colspan="11"><div class="position-panel" id="panel-${n.id}"></div></td>
    </tr>`;
  }).join('');
}

// ═══════════════════════════════════════════
// 职位展开 + 筛选
// ═══════════════════════════════════════════
async function toggleRow(noticeId){
  if(expandedRows.has(noticeId)){expandedRows.delete(noticeId);document.getElementById(`pos-${noticeId}`).style.display='none';document.getElementById(`icon-${noticeId}`).textContent='▶';return}
  const notice=allNotices.find(n=>n.id===noticeId);
  if(!notice||!notice.positions||!notice.positions.length)return;
  expandedRows.add(noticeId);
  document.getElementById(`pos-${noticeId}`).style.display='';
  document.getElementById(`icon-${noticeId}`).textContent='▼';
  const panel=document.getElementById(`panel-${noticeId}`);
  if(panel.innerHTML)return; // 已渲染

  if(!isPremium&&notice.positions.length>5){
    panel.innerHTML=`<div class="premium-blur">🔒 付费版可查看全部 ${notice.positions.length} 个岗位详情<br><small>输入兑换码解锁 + 职位智能筛选</small></div>`;return;
  }
  renderPositionPanel(panel,notice);
}

function renderPositionPanel(panel,notice){
  const pos=notice.positions;
  const cols=['position_code','dept_name','position_name','recruit_num','education','major','experience','political_status','other_requirements'];
  const colNames={position_code:'职位代码',dept_name:'招录单位',position_name:'职位名称',recruit_num:'人数',education:'学历',major:'专业',experience:'基层经验',political_status:'政治面貌',other_requirements:'其他'};

  let html='<div class="pos-toolbar">';
  html+='<input type="text" class="pos-filter" placeholder="🔍 筛选岗位（输入关键词，如 本科/法学/党员）" oninput="filterPositions('+notice.id+',this.value)">';
  html+='<span class="pos-count">共 '+pos.length+' 个岗位</span></div>';
  html+='<div class="pos-table-wrap"><table class="pos-table" id="postable-'+notice.id+'"><thead><tr>';
  cols.forEach(c=>{html+=`<th>${colNames[c]||c}</th>`});
  html+='</tr></thead><tbody>';
  pos.forEach((p,i)=>{
    html+=`<tr class="pos-tr" data-pos-text="${esc(Object.values(p).join(' ').toLowerCase())}">`;
    cols.forEach(c=>{html+=`<td>${esc(String(p[c]||'-'))}</td>`});
    html+='</tr>';
  });
  html+='</tbody></table></div>';
  panel.innerHTML=html;
}

function filterPositions(noticeId,query){
  const q=query.toLowerCase();
  document.querySelectorAll('#postable-'+noticeId+' .pos-tr').forEach(tr=>{
    tr.style.display=(!q||tr.dataset.posText.includes(q))?'':'none';
  });
  // 更新计数
  const visible=document.querySelectorAll('#postable-'+noticeId+' .pos-tr:not([style*="display: none"])').length;
  const countEl=document.querySelector('#pos-'+noticeId+' .pos-count');
  if(countEl){const total=document.querySelectorAll('#postable-'+noticeId+' .pos-tr').length;countEl.textContent='显示 '+visible+'/'+total+' 个岗位'}
}

// ═══════════════════════════════════════════
// CSV 导出 (付费)
// ═══════════════════════════════════════════
function exportCSV(){
  if(!isPremium){alert('🔒 导出CSV是付费功能');return}
  const rows=[['省份','类型','标题','报名开始','报名截止','笔试时间','招录人数','发布单位','原文链接']];
  allNotices.forEach(n=>{rows.push([n.province,n.exam_type,n.title,n.apply_start||'',n.apply_end||'',n.written_exam||'',n.recruit_count||'',n.publish_dept||'',n.source_url||''])});
  const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const b=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='公考公告_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}
</script>
</body>
</html>
