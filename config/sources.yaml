# 公务员考试公告数据源配置
# 大多数省份使用通用适配器 (adapter: generic)，选择器从 config.list_selectors 读取
# 特殊站点使用专用适配器 (adapter: guokao / fenbi)

sources:

  # ═══════════════════════════════════════════
  # 聚合源（数据最全，优先抓取）
  # ═══════════════════════════════════════════

  - province: 全国
    exam_type: 省考
    name: 粉笔网-公务员公告汇总
    url: https://m.fenbi.com/page/exams-information-list
    parser_type: html
    crawl_interval: 1800
    config:
      adapter: fenbi
      list_urls:
        - https://m.fenbi.com/page/exams-information-list?type=1&year=2026
        - https://m.fenbi.com/page/exams-information-list?type=3&year=2026

  # ═══════════════════════════════════════════
  # 国考
  # ═══════════════════════════════════════════

  - province: 全国
    exam_type: 国考
    name: 国家公务员局
    url: http://bm.scs.gov.cn
    parser_type: html
    crawl_interval: 3600
    config:
      adapter: guokao
      list_url: http://bm.scs.gov.cn/pp/gkweb/core/web/ui/business/article/articelist.html?ColumnId=7
      list_urls:
        - http://bm.scs.gov.cn/pp/gkweb/core/web/ui/business/article/articelist.html?ColumnId=7
        - http://bm.scs.gov.cn/pp/gkweb/core/web/ui/business/home/gkhome.html

  # ═══════════════════════════════════════════
  # 31 省省考 / 选调（通用适配器）
